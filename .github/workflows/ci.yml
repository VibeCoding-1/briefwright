# Tests, the leak scan, and the validators of the skill format and both plugin formats.
# Every action is pinned by commit SHA, with its release tag in the comment above it.
name: CI

on: [push, pull_request]

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  test:
    name: Tests and scan (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python:
          - "3.9"
          - "3.14"
    steps:
      # actions/checkout v7.0.1
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python }}
      # Commit metadata is only a warning here: web edits, merges and contributors' own addresses are routine.
      - name: Scan for secrets and personal data
        run: python tools/scan_public.py --tree . --commit HEAD --warn-metadata
      - name: Run the tests
        run: python tests/run_tests.py
      - name: Check the skill
        run: python tools/check_skill.py
      - name: Check the manifests
        run: python tools/check_manifests.py

  validate:
    name: Skill and plugin validators
    runs-on: ubuntu-24.04
    steps:
      # actions/checkout v7.0.1
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      # actions/setup-python v7.0.0; the skills-ref package needs Python 3.11 or newer, and its command is agentskills
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Validate the skill against the Agent Skills specification
        run: |
          python -m pip install "skills-ref==0.1.1" "click==8.5.0" "strictyaml==1.7.3"
          agentskills validate skills/briefwright
      - name: Validate plugin.json against the Agent Plugins 1.0.0 schema
        run: |
          python -m pip install "check-jsonschema==0.38.2"
          check-jsonschema --schemafile https://agent-plugins.org/schemas/1.0.0/plugin.schema.json plugin.json
      - name: Validate the Claude Code plugin
        run: |
          npm i -g "@anthropic-ai/claude-code@2.1.289"
          claude plugin validate . --strict
